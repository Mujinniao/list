name: update

on:
 # push:
 #   branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 11 * * *'

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set execute permission
      run: chmod +x ./mod.sh

    - name: Run script
      run: ./mod.sh

    - name: Commit outputs to data branch
      run: |
        git config --global user.email "action@github.com"
        git config --global user.name "GitHub Action"

        OUT="$RUNNER_TEMP/outputs"
        mkdir -p "$OUT"
        mv domain.txt modify.txt adall.txt "$OUT/"

        git fetch origin data:refs/remotes/origin/data || true
        git checkout --orphan data
        git rm -rf --quiet . 2>/dev/null || true
        git clean -fdx
        cp "$OUT"/* .

        # NOTE: 新增输出文件时必须同步加入此列表
        git add domain.txt modify.txt adall.txt

        git commit -m "update"
        git push -f origin data

    - name: Delete Workflow Runs
      uses: Mattraks/delete-workflow-runs@v2
      with:
        token: ${{ github.token }}
        repository: ${{ github.repository }}
        retain_days: 1
        keep_minimum_runs: 1
