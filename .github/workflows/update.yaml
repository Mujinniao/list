name: update

on:
 # push:
 #   branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 11 * * *'

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set execute permission
      run: chmod +x ./mod.sh

    - name: Run script
      run: ./mod.sh

    - name: Commit outputs to data branch
      run: |
        git config --global user.email "action@github.com"
        git config --global user.name "GitHub Action"

        OUT="$RUNNER_TEMP/outputs"
        mkdir -p "$OUT"
        mv domain.txt modify.txt adall.txt "$OUT/"

        git fetch origin data:refs/remotes/origin/data || true
        git checkout --orphan data-tmp
        git rm -rf --quiet . 2>/dev/null || true
        git clean -fdx
        cp "$OUT"/* .

        # NOTE: 新增输出文件时必须同步加入此列表
        git add domain.txt modify.txt adall.txt

        NEW_TREE=$(git write-tree)
        OLD_TREE=$(git rev-parse --verify origin/data^{tree} 2>/dev/null || true)

        if [ -n "$OLD_TREE" ] && [ "$NEW_TREE" = "$OLD_TREE" ]; then
          echo "No changes to commit"
          exit 0
        fi

        if [ -n "$OLD_TREE" ]; then
          PARENT=$(git commit-tree "$OLD_TREE" -m "snapshot")
          CHILD=$(git commit-tree "$NEW_TREE" -p "$PARENT" -m "update")
        else
          CHILD=$(git commit-tree "$NEW_TREE" -m "update")
        fi

        git push -f origin "$CHILD:refs/heads/data"

    - name: Delete Workflow Runs
      uses: Mattraks/delete-workflow-runs@v2
      with:
        token: ${{ github.token }}
        repository: ${{ github.repository }}
        retain_days: 1
        keep_minimum_runs: 1
