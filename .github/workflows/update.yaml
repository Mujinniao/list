name: update

on:
 # push:
 #   branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 11 * * *'

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set execute permission
      run: chmod +x ./mod.sh

    - name: Run script
      run: ./mod.sh

    - name: Commit outputs to data branch
      run: |
        git config --global user.email "action@github.com"
        git config --global user.name "GitHub Action"

        OUT="$RUNNER_TEMP/outputs"
        mkdir -p "$OUT"
        mv domain.txt modify.txt adall.txt "$OUT/"

        git fetch origin data:refs/remotes/origin/data || true
        git checkout --orphan data-tmp
        git rm -rf --quiet . 2>/dev/null || true
        git clean -fdx
        cp "$OUT"/* .

        # NOTE: 新增输出文件时必须同步加入此列表
        git add domain.txt modify.txt adall.txt

        NEW_TREE=$(git write-tree)
        OLD_COMMIT=$(git rev-parse --verify origin/data 2>/dev/null || true)
        OLD_TREE=$(git rev-parse --verify origin/data^{tree} 2>/dev/null || true)

        if [ -n "$OLD_TREE" ] && [ "$NEW_TREE" = "$OLD_TREE" ]; then
          echo "No changes to commit"
          exit 0
        fi

        if [ -z "$OLD_COMMIT" ]; then
          CHILD=$(git commit-tree "$NEW_TREE" -m "update")
          git push origin "$CHILD:refs/heads/data"
        elif [ "$(git log -1 --format=%cd --date=format:%Y-%m "$OLD_COMMIT")" != "$(date -u +%Y-%m)" ]; then
          # 月度清理：tip 仍属上月或更早 → 压成 1 条并强推
          CHILD=$(git commit-tree "$NEW_TREE" -m "update")
          git push -f origin "$CHILD:refs/heads/data"
        else
          # 当月正常追加
          CHILD=$(git commit-tree "$NEW_TREE" -p "$OLD_COMMIT" -m "update")
          git push origin "$CHILD:refs/heads/data"
        fi

    - name: Delete Workflow Runs
      uses: Mattraks/delete-workflow-runs@v2
      with:
        token: ${{ github.token }}
        repository: ${{ github.repository }}
        retain_days: 1
        keep_minimum_runs: 1
